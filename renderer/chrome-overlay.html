<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --co-ntp-shadow-soft: 0 4px 20px rgba(15, 23, 42, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --co-ntp-shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.35);
      }
    }

    html[data-forced-appearance="light"] {
      --co-ntp-shadow-soft: 0 4px 20px rgba(15, 23, 42, 0.05);
    }

    html[data-forced-appearance="dark"] {
      --co-ntp-shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #backdrop {
      position: fixed;
      inset: 0;
      background: transparent;
      display: none;
      z-index: 10;
    }

    #backdrop.co-visible {
      display: block;
    }

    #backdrop.co-backdrop--omnibox {
      background: transparent;
    }

    #panel {
      position: fixed;
      display: none;
      z-index: 20;
      min-width: 260px;
      max-height: min(360px, 70vh);
      overflow-y: auto;
      padding: 6px 0;
      background: var(--chrome-nav-bg, #394d55);
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      border: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.12));
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    #panel.co-visible {
      display: block;
    }

    #panel.co-panel--app-menu {
      overflow: visible;
    }

    #submenu {
      position: fixed;
      display: none;
      z-index: 21;
      min-width: 260px;
      max-height: min(420px, 78vh);
      overflow-y: auto;
      padding: 6px 0;
      background: var(--chrome-nav-bg, #394d55);
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      border: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.12));
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    #submenu.co-visible {
      display: block;
    }

    /* Site Info Popover Styles */
    .co-site-info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .co-site-info-domain {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .co-site-info-close-btn {
      background: transparent;
      border: none;
      padding: 4px;
      margin: -4px;
      border-radius: 50%;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .co-site-info-close-btn:hover {
      opacity: 1;
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.05));
    }
    .co-site-info-content {
      display: flex;
      flex-direction: column;
      padding-bottom: 8px;
    }
    .co-site-info-row {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: inherit;
      text-align: left;
      cursor: pointer;
      gap: 12px;
    }
    .co-site-info-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.04));
    }
    .co-site-info-row-tall {
      padding: 12px 16px;
    }
    .co-site-info-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .co-site-info-text-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .co-site-info-text {
      font-size: 13px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .co-site-info-subtext {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .co-site-info-action {
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .co-site-info-header--sub {
      justify-content: flex-start;
      gap: 12px;
      padding: 10px 16px;
    }
    .co-site-info-icon-btn {
      background: transparent;
      border: none;
      padding: 6px;
      margin: -6px;
      border-radius: 50%;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .co-site-info-icon-btn:hover {
      opacity: 1;
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.05));
    }
    .co-site-info-title-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }
    .co-site-info-title {
      font-size: 15px;
      font-weight: 500;
    }
    .co-site-info-subtitle {
      font-size: 12px;
      opacity: 0.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .co-site-info-security-body {
      display: flex;
      padding: 16px;
      gap: 16px;
      align-items: flex-start;
    }
    .co-site-info-security-text {
      display: flex;
      flex-direction: column;
    }
    .co-site-info-security-heading {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .co-site-info-security-desc {
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.4;
    }
    .co-site-info-link {
      color: #1a73e8;
      text-decoration: none;
    }
    .co-site-info-link:hover {
      text-decoration: underline;
    }
    @media (prefers-color-scheme: dark) {
      .co-site-info-link {
        color: #8ab4f8;
      }
    }
    .co-row {
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .co-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
    }

    .co-row--highlight {
      margin: 4px 8px;
      width: calc(100% - 16px);
      border-radius: 10px;
      background: color-mix(in srgb, var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.08)) 72%, transparent);
    }

    .co-row--disabled {
      opacity: 0.55;
      cursor: default;
      pointer-events: none;
    }

    .co-row__label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .co-row__right {
      margin-left: auto;
      opacity: 0.92;
      font-size: 12px;
      color: var(--chrome-url-ghost, #9aa0a6);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .co-row__chevron {
      font-size: 14px;
      line-height: 1;
    }

    .co-row__icon {
      width: 24px;
      height: 16px;
      text-align: center;
      opacity: 0.9;
      flex: 0 0 24px;
    }

    .co-row__icon-img {
      display: block;
      width: 16px;
      height: 16px;
      margin: 0 auto;
      object-fit: contain;
    }

    .co-row__avatar {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      overflow: hidden;
      flex: 0 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .co-row__avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .co-row__avatar-img--preset {
      object-fit: contain;
      padding: 3px;
      background: #f1f3f4;
    }

    .co-row--header {
      padding-top: 8px;
      padding-bottom: 8px;
      font-weight: 600;
    }

    .co-row--header:hover {
      background: transparent;
    }

    .co-divider {
      height: 1px;
      margin: 6px 12px;
      background: var(--chrome-tab-separator, rgba(0, 0, 0, 0.1));
    }

    .co-site-info-divider {
      height: 1px;
      margin: 0;
      background: var(--chrome-tab-separator, rgba(0, 0, 0, 0.1));
    }

    .co-row--add {
      font-weight: 500;
    }

    /* ── Bookmark editor (omnibox star) — Chrome-style compact dialog ───────── */
    #panel.co-panel--editor {
      min-width: 280px;
      max-width: min(360px, calc(100vw - 16px));
      max-height: min(480px, 82vh);
      padding: 0;
      overflow: hidden;
      display: none;
      background: var(--chrome-nav-bg, #ffffff);
    }

    #panel.co-panel--editor.co-visible {
      display: flex;
      flex-direction: column;
    }

    .co-bk-editor-scroll {
      padding: 14px 16px 16px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .co-bk-url {
      font-size: 11px;
      color: var(--chrome-url-ghost, #5f6368);
      word-break: break-all;
      line-height: 1.35;
      margin-bottom: 10px;
      max-height: 40px;
      overflow: hidden;
    }

    .co-bk-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .co-bk-field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--chrome-url-ghost, #5f6368);
    }

    .co-bk-input,
    .co-bk-select {
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--chrome-tab-separator, #dadce0);
      border-radius: 6px;
      width: 100%;
      background: var(--chrome-url-well, #ffffff);
      color: var(--chrome-fg, #202124);
      font-family: inherit;
    }

    .co-bk-input:focus,
    .co-bk-select:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }

    .co-bk-link {
      margin-top: 4px;
      padding: 6px 0;
      border: none;
      background: none;
      color: #1a73e8;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .co-bk-link:hover {
      text-decoration: underline;
    }

    .co-bk-link__icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      background: currentColor;
      -webkit-mask: url('assets/images/add.svg') center / contain no-repeat;
      mask: url('assets/images/add.svg') center / contain no-repeat;
    }

    .co-bk-new-folder {
      display: none;
      margin: 10px -16px 2px;
      padding: 16px 16px 12px;
      border-top: 1px solid var(--chrome-tab-separator, #e8eaed);
      background: color-mix(in srgb, var(--chrome-nav-bg, #ffffff) 92%, var(--chrome-url-well, #f8fafd));
    }

    .co-bk-new-folder.co-bk-visible {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .co-bk-new-folder__actions {
      margin-top: 0;
      padding-top: 0;
    }

    .co-bk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
      padding-top: 4px;
    }

    .co-bk-footer-actions {
      margin: 12px -16px -4px;
      padding: 12px 16px 0;
      border-top: 1px solid var(--chrome-tab-separator, #e8eaed);
    }

    .co-bk-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      border: none;
      cursor: pointer;
    }

    .co-bk-btn--primary {
      background: var(--chrome-omnibox-focus-border, #1a73e8);
      color: var(--chrome-omnibox-selection-fg, #fff);
      font-weight: 500;
    }

    .co-bk-btn--primary:hover {
      background: color-mix(in srgb, var(--chrome-omnibox-focus-border, #1a73e8) 84%, #000000);
    }

    .co-bk-btn--secondary {
      background: transparent;
      color: var(--chrome-fg, #202124);
      font-weight: 500;
    }

    .co-bk-btn--secondary:hover {
      background: var(--chrome-close-hover, #e8eaed);
    }

    .co-bk-btn--danger {
      background: transparent;
      color: #d93025;
      margin-right: auto;
      padding-left: 0;
    }

    .co-bk-btn--danger:hover {
      text-decoration: underline;
    }

    .co-bk-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ── Omnibox autocomplete (Tier 2, tokens match shell omnibox row) ─ */
    #panel.co-panel--omnibox {
      --co-omnibox-border-shade: color-mix(in srgb, var(--chrome-nav-bg, #394d55) 76%, #000000);
      padding: 0;
      overflow: hidden;
      max-height: min(420px, 72vh);
      background: var(--chrome-nav-bg, #394d55);
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      border: none;
      border-radius: 20px;
      box-shadow: var(--co-ntp-shadow-soft);
      display: flex;
      flex-direction: column;
    }

    #panel.co-panel--omnibox::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 0%, var(--co-omnibox-border-shade) 64%, var(--co-omnibox-border-shade) 100%);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 3;
    }

    .co-ob-input-wrap {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      border-radius: 20px 20px 0 0;
    }

    .co-ob-input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      color: var(--chrome-toolbar-icon, var(--chrome-fg));
      opacity: 0.5;
      z-index: 2;
    }

    .co-ob-input-icon svg {
      width: 14px;
      height: 14px;
    }

    .co-ob-input {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      background: transparent;
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      font-family: inherit;
      font-size: 14px;
      padding: 0 15px 0 38px;
      border-radius: 20px 20px 0 0;
    }

    .co-ob-input::selection {
      background: var(--chrome-omnibox-selection-bg, #FFB430);
      color: var(--chrome-omnibox-selection-fg, #ffffff);
    }

    .co-ob-ghost {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 15px 0 38px;
      font-size: 14px;
      font-family: inherit;
      white-space: pre;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      color: transparent;
    }

    .co-ob-ghost__suffix {
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.35));
    }

    #panel.co-panel--omnibox .co-ob-scroll {
      max-height: min(412px, 70vh);
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 6px;
    }

    .co-ob-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 12px;
      font-size: 13px;
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.45));
      text-align: center;
      user-select: none;
      pointer-events: none;
    }

    .co-ob-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 12px;
      min-height: 36px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .co-ob-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
    }

    .co-ob-row--selected {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
      box-shadow: inset 0 0 0 1px var(--chrome-omnibox-focus-border, rgba(255, 180, 48, 0.5));
    }

    .co-ob-row__icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--chrome-toolbar-icon-muted, rgba(255, 255, 255, 0.55));
    }

    .co-ob-row__icon svg {
      width: 14px;
      height: 14px;
      opacity: 1;
    }

    .co-ob-row__favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: contain;
    }

    .co-ob-row__content {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      overflow: hidden;
    }

    .co-ob-row__text {
      flex-shrink: 0;
      max-width: 55%;
      font-size: 13px;
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .co-ob-row__text strong {
      color: var(--chrome-domain, #ffffff);
      font-weight: 600;
    }

    .co-ob-row__description {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.4));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .co-ob-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .co-ob-badge--history {
      background: rgba(255, 255, 255, 0.08);
      color: #aaa;
    }

    .co-ob-badge--search {
      background: rgba(66, 133, 244, 0.18);
      color: #8ab4f8;
    }

    .co-ob-badge--keyword {
      background: rgba(52, 168, 83, 0.18);
      color: #81c995;
    }

    .co-ob-badge--bookmark {
      background: rgba(251, 188, 4, 0.18);
      color: #fdd663;
    }

    .co-ob-badge--url {
      background: rgba(255, 255, 255, 0.08);
      color: #aaa;
    }

    /* ── Bookmark bar folder dropdown (Chrome-style, max 90vh, scroll list) ─── */
    #panel.co-panel--folder-menu {
      display: none;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      max-height: 90vh;
      background: var(--chrome-bookmark-bar, var(--chrome-nav-bg, #2d3e45));
      color: var(--chrome-bkm-text, var(--chrome-fg, rgba(255, 255, 255, 0.88)));
      border: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.12));
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    #panel.co-panel--folder-menu.co-visible {
      display: flex;
    }

    .co-fm-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.1));
      font-size: 13px;
      font-weight: 600;
      min-height: 40px;
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
    }

    .co-fm-header-icon {
      display: flex;
      align-items: center;
      opacity: 0.75;
      color: var(--chrome-toolbar-icon-muted, rgba(255, 255, 255, 0.58));
    }

    .co-fm-header-icon svg {
      width: 14px;
      height: 14px;
    }

    .co-fm-header-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .co-fm-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0;
    }

    .co-fm-empty {
      padding: 16px 12px;
      font-size: 13px;
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.4));
      font-style: italic;
    }

    .co-fm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      min-height: 36px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .co-fm-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
    }

    .co-fm-row--folder {
      opacity: 0.68;
      cursor: default;
    }

    .co-fm-row--folder:hover {
      background: var(--chrome-close-hover, rgba(0, 0, 0, 0.04));
    }

    .co-fm-row__icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--chrome-toolbar-icon-muted, rgba(255, 255, 255, 0.58));
    }

    .co-fm-row__icon svg {
      width: 13px;
      height: 13px;
      opacity: 1;
    }

    .co-fm-row__favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: contain;
    }

    .co-fm-row__label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .co-lens-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: crosshair;
      user-select: none;
      touch-action: none;
      background: transparent;
      pointer-events: none;
    }

    .co-lens-layer--dragging {
      background: transparent;
    }

    .co-lens-panel-backdrop {
      position: absolute;
      z-index: 0;
      border-radius: 0;
      background: var(--chrome-shell-tint, var(--chrome-shell-bg, var(--chrome-body-bg, #ffffff)));
      pointer-events: none;
    }

    /* ── Layer 2: Center Card preserving aspect-ratio ── */
    .co-lens-site-frame {
      position: absolute;
      z-index: 2;
      border-radius: 12px !important;
      border: 1px solid var(--chrome-tab-separator, rgba(95, 99, 104, 0.24)) !important;
      pointer-events: auto;
      cursor: crosshair;
      background: var(--chrome-shell-tint, var(--chrome-shell-bg, transparent));
      box-shadow: none;
      overflow: hidden;
    }

    /* ── Layer 1: Left Panel Blurred Background ── */
    .co-lens-bg-blur {
      position: absolute;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3);
    }

    .co-lens-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(24px) brightness(0.55) saturate(1.25);
      transform: scale(1.08);
      /* Eliminates white margins around the blur */
      will-change: transform;
    }

    .co-lens-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.1);
      pointer-events: none;
    }

    .co-lens-selection-mask {
      position: absolute;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    .co-lens-sharp-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* ── Spotlight dimming selection ── */
    .co-lens-selection {
      position: absolute;
      z-index: 4;
      display: none;
      border: 0;
      border-radius: 10px !important;
      background: transparent;
      pointer-events: none;
      box-shadow: none;
    }

    .co-lens-selection.co-visible {
      display: block;
    }

    .co-lens-layer--dragging .co-lens-selection.co-visible {
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.96),
        0 0 0 9999px rgba(0, 0, 0, 0.45) !important;
    }

    .co-lens-selection.co-lens-selection--complete {
      border-color: transparent;
      box-shadow:
        -18px -10px 34px rgba(54, 197, 240, 0.34),
        18px -10px 34px rgba(46, 182, 125, 0.3),
        -16px 14px 34px rgba(224, 30, 90, 0.26),
        18px 16px 38px rgba(236, 178, 46, 0.28),
        0 0 72px rgba(97, 96, 255, 0.18) !important;
    }

    .co-lens-selection-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      opacity: 0;
      border: 0 solid rgba(255, 255, 255, 0.98);
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }

    .co-lens-selection--complete .co-lens-selection-corner {
      opacity: 1;
      width: 24px;
      height: 24px;
    }

    .co-lens-selection--complete.co-lens-selection--animate .co-lens-selection-corner {
      animation: co-lens-corner-contract 180ms ease-out both;
    }

    .co-lens-selection-corner--tl {
      left: -3px;
      top: -3px;
      border-top-width: 3px;
      border-left-width: 3px;
      border-top-left-radius: 10px;
    }

    .co-lens-selection-corner--tr {
      right: -3px;
      top: -3px;
      border-top-width: 3px;
      border-right-width: 3px;
      border-top-right-radius: 10px;
    }

    .co-lens-selection-corner--bl {
      left: -3px;
      bottom: -3px;
      border-bottom-width: 3px;
      border-left-width: 3px;
      border-bottom-left-radius: 10px;
    }

    .co-lens-selection-corner--br {
      right: -3px;
      bottom: -3px;
      border-bottom-width: 3px;
      border-right-width: 3px;
      border-bottom-right-radius: 10px;
    }

    @keyframes co-lens-corner-contract {
      from {
        width: 100%;
        height: 100%;
      }

      to {
        width: 24px;
        height: 24px;
      }
    }

    .co-lens-chip {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      max-width: min(520px, calc(100% - 28px));
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(32, 33, 36, 0.92);
      color: #fff;
      font-size: 12px;
      line-height: 1.3;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.26);
      pointer-events: none;
      white-space: nowrap;
    }

    .co-lens-chip.co-hidden {
      display: none;
    }

    .co-lens-resizer {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 96px;
      transform: translate(-50%, -50%);
      cursor: col-resize;
      pointer-events: auto;
      touch-action: none;
      z-index: 6;
    }

    .co-lens-resizer::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 100%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18), 0 8px 24px rgba(0, 0, 0, 0.34);
    }

    .co-lens-cursor-tooltip {
      position: absolute;
      z-index: 3;
      display: none;
      padding: 5px 8px;
      border-radius: 4px;
      background: rgba(32, 33, 36, 0.95);
      color: #fff;
      font-size: 11px;
      line-height: 1.25;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
      pointer-events: none;
      white-space: nowrap;
    }

    .co-lens-cursor-tooltip.co-visible {
      display: block;
    }

    .co-lens-magnifier {
      position: absolute;
      z-index: 5;
      width: 116px;
      height: 116px;
      border: 0;
      border-radius: 999px;
      display: none;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.9);
      background-repeat: no-repeat;
      border: 3px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.34);
      pointer-events: none;
    }

    .co-lens-magnifier.co-visible {
      display: block;
    }

    .co-lens-magnifier::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      background:
        linear-gradient(to bottom, transparent 0 8px, rgba(0, 0, 0, 0.95) 8px 9px, rgba(255, 255, 255, 0.98) 9px 10px, transparent 10px),
        linear-gradient(to right, transparent 0 8px, rgba(0, 0, 0, 0.95) 8px 9px, rgba(255, 255, 255, 0.98) 9px 10px, transparent 10px);
      background-size: 18px 18px, 18px 18px;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.95;
    }

    .co-lens-close {
      position: absolute;
      z-index: 4;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: rgba(60, 64, 67, 0.92);
      color: #fff;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.24);
      cursor: pointer;
      font-size: 19px;
      line-height: 28px;
      pointer-events: auto;
    }

    .co-lens-actions {
      position: absolute;
      z-index: 4;
      display: none;
      min-width: 118px;
      padding: 6px;
      border-radius: 8px;
      background: #fff;
      color: #202124;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.24);
      pointer-events: auto;
    }

    .co-lens-actions.co-visible {
      display: block;
    }

    .co-lens-action {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 6px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }

    .co-lens-action:hover {
      background: #f1f3f4;
    }

    .co-lens-action-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .co-lens-copy-toast {
      position: absolute;
      z-index: 5;
      display: none;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(32, 33, 36, 0.94);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
      pointer-events: none;
      transform: translateY(4px);
      opacity: 0;
      transition: opacity 120ms ease-out, transform 120ms ease-out;
    }

    .co-lens-copy-toast.co-visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div id="backdrop" aria-hidden="true"></div>
  <div id="panel" role="menu" aria-hidden="true"></div>
  <script>
    (function () {
      const backdrop = document.getElementById('backdrop');
      const panel = document.getElementById('panel');
      const submenu = document.createElement('div');
      submenu.id = 'submenu';
      document.body.appendChild(submenu);
      const api = window.electronAPI;
      const overlaySearch = window.location.search || '';
      const IS_SHELL_MENU_OVERLAY = overlaySearch.indexOf('shellMenu=1') >= 0;
      const IS_OMNIBOX_OVERLAY = overlaySearch.indexOf('omnibox=1') >= 0;
      const IS_LENS_OVERLAY = !IS_SHELL_MENU_OVERLAY && !IS_OMNIBOX_OVERLAY;
      let submenuHideTimer = null;
      let lensLayer = null;
      let lensPointerId = null;

      function notifyHost(data) {
        if (api && api.chromeOverlayNotifyHost) api.chromeOverlayNotifyHost(data);
      }

      function applyChromeThemeTokens(patch) {
        const root = document.documentElement;
        const tokens = patch.tokens && typeof patch.tokens === 'object' ? patch.tokens : {};
        Object.keys(tokens).forEach(function (k) {
          const v = tokens[k];
          if (v === undefined || v === null || v === '') return;
          root.style.setProperty(k, String(v));
        });
        root.style.colorScheme = patch.effectiveDark ? 'dark' : 'light';
        const fa = patch.forcedAppearance;
        if (fa === 'light' || fa === 'dark') {
          root.setAttribute('data-forced-appearance', fa);
        } else {
          root.removeAttribute('data-forced-appearance');
        }
      }

      function hideAll() {
        omniboxFocusGen += 1;
        disableOmniboxEscapeDismiss();
        omniboxDismissPending = false;
        omniboxPanelGuardsBound = false;
        omniboxOverlayInput = null;
        omniboxOverlayScroll = null;
        backdrop.classList.remove('co-visible', 'co-backdrop--omnibox');
        panel.classList.remove('co-visible', 'co-panel--editor', 'co-panel--omnibox', 'co-panel--folder-menu', 'co-panel--app-menu');
        panel.style.width = '';
        panel.style.minWidth = '';
        panel.style.maxWidth = '';
        panel.style.maxHeight = '';
        panel.style.padding = '';
        panel.style.overflow = '';
        panel.innerHTML = '';
        submenu.classList.remove('co-visible');
        submenu.style.left = '';
        submenu.style.top = '';
        submenu.innerHTML = '';
        if (submenuHideTimer) {
          clearTimeout(submenuHideTimer);
          submenuHideTimer = null;
        }
        hideLensSelection();
      }

      function hideLensSelection() {
        lensPointerId = null;
        if (lensLayer && lensLayer.parentNode) {
          lensLayer.parentNode.removeChild(lensLayer);
        }
        lensLayer = null;
      }

      function renderLensSelection(patch) {
        hideAll();
        hideLensSelection();
        lensLayer = document.createElement('div');
        lensLayer.className = 'co-lens-layer';
        lensLayer.setAttribute('role', 'application');
        lensLayer.setAttribute('aria-label', 'Search with Google Lens selection area');

        const siteRect = patch.siteBounds || {};
        const site = {
          x: Math.round(Number(siteRect.x) || 0),
          y: Math.round(Number(siteRect.y) || 0),
          width: Math.round(Number(siteRect.width) || window.innerWidth),
          height: Math.round(Number(siteRect.height) || window.innerHeight),
        };
        const leftPanelRect = patch.leftPanelBounds || site;
        const leftPanel = {
          x: Math.round(Number(leftPanelRect.x) || site.x),
          y: Math.round(Number(leftPanelRect.y) || site.y),
          width: Math.round(Number(leftPanelRect.width) || site.width),
          height: Math.round(Number(leftPanelRect.height) || site.height),
        };
        const sidebarRect = patch.sidebarBounds || {};
        const sidebar = {
          x: Math.round(Number(sidebarRect.x) || ((Number(patch.windowWidth) || window.innerWidth) - Number(patch.sidebarWidth || 0))),
          y: Math.round(Number(sidebarRect.y) || 0),
          width: Math.round(Number(sidebarRect.width) || Number(patch.sidebarWidth || 0)),
          height: Math.round(Number(sidebarRect.height) || window.innerHeight),
        };
        const panelGap = Math.max(14, Math.round(Number(patch.panelGap) || 14));
        const panelRadius = Math.max(12, Math.round(Number(patch.panelRadius) || 24));
        const windowWidth = Math.max(1, Number(patch.windowWidth) || window.innerWidth);
        const contentHeight = Math.max(1, Number(patch.contentHeight) || window.innerHeight);
        const backdropTop = Math.max(0, Math.round(Number(patch.backdropTop) || 0));
        const sourceWidth = Math.max(1, Number(patch.sourceWidth) || windowWidth);
        const sourceHeight = Math.max(1, Number(patch.sourceHeight) || contentHeight);

        const backdropPieces = [];
        const addBackdropPiece = function (x, y, width, height) {
          if (width <= 1 || height <= 1) return;
          const piece = document.createElement('div');
          piece.className = 'co-lens-panel-backdrop';
          piece.style.left = Math.round(x) + 'px';
          piece.style.top = Math.round(y) + 'px';
          piece.style.width = Math.round(width) + 'px';
          piece.style.height = Math.round(height) + 'px';
          lensLayer.appendChild(piece);
          backdropPieces.push(piece);
        };

        const renderPanelBackdrops = function () {
          while (backdropPieces.length) {
            const piece = backdropPieces.pop();
            if (piece && piece.parentNode) piece.parentNode.removeChild(piece);
          }
          // Only mask areas *outside* of the Left Panel Workspace and Right Sidebar 
          addBackdropPiece(0, backdropTop, windowWidth, Math.max(0, Math.max(leftPanel.y, sidebar.y) - backdropTop));
          addBackdropPiece(0, Math.max(leftPanel.y + leftPanel.height, sidebar.y + sidebar.height), windowWidth, Math.max(0, contentHeight - Math.max(leftPanel.y + leftPanel.height, sidebar.y + sidebar.height)));
          addBackdropPiece(0, Math.min(leftPanel.y, sidebar.y), Math.max(0, leftPanel.x), Math.max(leftPanel.height, sidebar.height));
          addBackdropPiece(leftPanel.x + leftPanel.width, Math.min(leftPanel.y, sidebar.y), Math.max(0, sidebar.x - (leftPanel.x + leftPanel.width)), Math.max(leftPanel.height, sidebar.height));
          addBackdropPiece(sidebar.x + sidebar.width, Math.min(leftPanel.y, sidebar.y), Math.max(0, windowWidth - (sidebar.x + sidebar.width)), Math.max(leftPanel.height, sidebar.height));
        };

        renderPanelBackdrops();

        // ── View 1: Layered Blurred Background on the Left Workspace ──
        const bgBlur = document.createElement('div');
        bgBlur.className = 'co-lens-bg-blur';
        bgBlur.style.left = leftPanel.x + 'px';
        bgBlur.style.top = leftPanel.y + 'px';
        bgBlur.style.width = leftPanel.width + 'px';
        bgBlur.style.height = leftPanel.height + 'px';
        bgBlur.style.borderRadius = panelRadius + 'px';

        if (patch.snapshotDataUrl) {
          const bgImg = document.createElement('img');
          bgImg.className = 'co-lens-bg-image';
          bgImg.src = patch.snapshotDataUrl;
          bgImg.alt = '';
          bgBlur.appendChild(bgImg);

          const bgOverlay = document.createElement('div');
          bgOverlay.className = 'co-lens-bg-overlay';
          bgBlur.appendChild(bgOverlay);
        }
        lensLayer.appendChild(bgBlur);

        // ── View 2: Sharp Foregound centered card inside computed site frame bounds ──
        const siteFrame = document.createElement('div');
        siteFrame.className = 'co-lens-site-frame';
        siteFrame.style.left = site.x + 'px';
        siteFrame.style.top = site.y + 'px';
        siteFrame.style.width = site.width + 'px';
        siteFrame.style.height = site.height + 'px';

        if (patch.snapshotDataUrl) {
          const sharpImg = document.createElement('img');
          sharpImg.className = 'co-lens-sharp-image';
          sharpImg.src = patch.snapshotDataUrl;
          sharpImg.alt = '';
          siteFrame.appendChild(sharpImg);
        }
        lensLayer.appendChild(siteFrame);

        const leftClose = document.createElement('button');
        leftClose.type = 'button';
        leftClose.className = 'co-lens-close';
        leftClose.textContent = '×';
        leftClose.title = 'Close Google Lens';
        leftClose.style.left = Math.max(8, site.x + site.width - 14) + 'px';
        leftClose.style.top = Math.max(8, site.y - 14) + 'px';
        lensLayer.appendChild(leftClose);

        const chip = document.createElement('div');
        chip.className = 'co-lens-chip';
        if (patch.hasSelection) chip.classList.add('co-hidden');
        chip.textContent = patch.hint || 'Select any text or image to search with Google Lens';
        lensLayer.appendChild(chip);

        const magnifier = document.createElement('div');
        magnifier.className = 'co-lens-magnifier';
        // GPU optimization: magnifier uses the local high-res snapshot already on client side
        const magnifierImage = typeof patch.snapshotDataUrl === 'string' ? patch.snapshotDataUrl : '';
        if (magnifierImage) {
          magnifier.style.backgroundImage = 'url("' + magnifierImage.replace(/"/g, '\\"') + '")';
        }
        lensLayer.appendChild(magnifier);

        const selectionMask = document.createElement('div');
        selectionMask.className = 'co-lens-selection-mask';
        selectionMask.style.left = leftPanel.x + 'px';
        selectionMask.style.top = leftPanel.y + 'px';
        selectionMask.style.width = leftPanel.width + 'px';
        selectionMask.style.height = leftPanel.height + 'px';
        selectionMask.style.borderRadius = panelRadius + 'px';
        lensLayer.appendChild(selectionMask);

        const selection = document.createElement('div');
        selection.className = 'co-lens-selection';
        ['tl', 'tr', 'bl', 'br'].forEach(function (corner) {
          const cornerEl = document.createElement('div');
          cornerEl.className = 'co-lens-selection-corner co-lens-selection-corner--' + corner;
          selection.appendChild(cornerEl);
        });
        selectionMask.appendChild(selection);

        const actions = document.createElement('div');
        actions.className = 'co-lens-actions';
        const copyTextIcon = 'assets/images/poll-h.svg';
        const copyImageIcon = 'assets/images/picture.svg';
        actions.innerHTML = (patch.hasSelectionText
          ? '<button class="co-lens-action" type="button" data-action="copyText"><img class="co-lens-action-icon" src="' + copyTextIcon + '" alt="">Copy text</button>'
          : '') + '<button class="co-lens-action" type="button" data-action="copyImage"><img class="co-lens-action-icon" src="' + copyImageIcon + '" alt="">Copy as image</button>';
        lensLayer.appendChild(actions);

        const copyToast = document.createElement('div');
        copyToast.className = 'co-lens-copy-toast';
        copyToast.textContent = 'Copied';
        lensLayer.appendChild(copyToast);
        let copyToastTimer = null;

        const resizer = document.createElement('div');
        resizer.className = 'co-lens-resizer';
        resizer.setAttribute('title', 'Resize Lens sidebar');
        lensLayer.appendChild(resizer);

        const cursorTooltip = document.createElement('div');
        cursorTooltip.className = 'co-lens-cursor-tooltip';
        cursorTooltip.textContent = 'Drag to search';
        lensLayer.appendChild(cursorTooltip);

        let startX = 0;
        let startY = 0;
        let currentRect = null;
        let resizePointerId = null;
        let resizeStartX = 0;
        let resizeStartWidth = Number(patch.sidebarWidth) || resizeStartWidth;
        let selectionStarted = !!patch.hasSelection;
        let selectedRatio = patch.selectionRatio && typeof patch.selectionRatio === 'object'
          ? {
            x: Math.max(0, Number(patch.selectionRatio.x) || 0),
            y: Math.max(0, Number(patch.selectionRatio.y) || 0),
            width: Math.max(0, Number(patch.selectionRatio.width) || 0),
            height: Math.max(0, Number(patch.selectionRatio.height) || 0),
          }
          : null;

        const positionResizer = function () {
          resizer.style.left = Math.max(0, sidebar.x - Math.floor(panelGap / 2)) + 'px';
          resizer.style.top = Math.round(sidebar.y + (sidebar.height / 2)) + 'px';
          resizer.style.width = Math.max(12, panelGap) + 'px';
          resizer.style.height = Math.max(96, sidebar.height) + 'px';
        };

        positionResizer();

        const rectFromSelectionRatio = function () {
          if (!selectedRatio) return null;
          return {
            x: site.x + (selectedRatio.x * site.width),
            y: site.y + (selectedRatio.y * site.height),
            width: Math.max(8, selectedRatio.width * site.width),
            height: Math.max(8, selectedRatio.height * site.height),
          };
        };

        const applyResizePreview = function (nextWidth) {
          sidebar.width = nextWidth;
          sidebar.x = Math.max(panelGap, windowWidth - nextWidth - panelGap);
          leftPanel.width = Math.max(0, sidebar.x - (panelGap * 2));
          const maxContainerWidth = Math.max(1, leftPanel.width - 16);
          const maxContainerHeight = Math.max(1, leftPanel.height - 16);
          const scale = Math.max(0.05, Math.min(1, maxContainerWidth / sourceWidth, maxContainerHeight / sourceHeight));
          site.width = Math.min(Math.max(1, Math.floor(sourceWidth * scale)), maxContainerWidth);
          site.height = Math.min(Math.max(1, Math.floor(sourceHeight * scale)), maxContainerHeight);
          site.x = leftPanel.x + Math.max(8, Math.floor((leftPanel.width - site.width) / 2));
          site.y = leftPanel.y + Math.max(8, Math.floor((leftPanel.height - site.height) / 2));

          // Reflow the blurred background
          bgBlur.style.left = leftPanel.x + 'px';
          bgBlur.style.top = leftPanel.y + 'px';
          bgBlur.style.width = leftPanel.width + 'px';
          bgBlur.style.height = leftPanel.height + 'px';
          selectionMask.style.left = leftPanel.x + 'px';
          selectionMask.style.top = leftPanel.y + 'px';
          selectionMask.style.width = leftPanel.width + 'px';
          selectionMask.style.height = leftPanel.height + 'px';

          // Reflow the sharp centered frame
          siteFrame.style.left = site.x + 'px';
          siteFrame.style.top = site.y + 'px';
          siteFrame.style.width = site.width + 'px';
          siteFrame.style.height = site.height + 'px';

          leftClose.style.left = Math.max(8, site.x + site.width - 14) + 'px';

      function appendHighlightedOmnibox(parent, text, query) {
        text = String(text || '');

          var matchIdx = lowerText.indexOf(lowerQuery, searchFrom);

          strong.textContent = text.slice(matchIdx, matchIdx + lowerQuery.length);
          parent.appendChild(strong);
          lastIndex = matchIdx + lowerQuery.length;
          searchFrom = lastIndex;

          parent.appendChild(document.createTextNode(text.slice(lastIndex)));

        panel.style.width = width + 'px';
        panel.style.minWidth = width + 'px';
        panel.style.maxWidth = width + 'px';
        panel.style.maxHeight = Math.max(
          240,
          Math.min(metrics.viewportHeight - top - 8, window.innerHeight - panelPoint.top - 8)
        ) + 'px';
        panel.style.overflow = 'visible';
        panel.classList.add('co-panel--app-menu');

        const items = Array.isArray(payload.items) ? payload.items : [];
        items.forEach(function (it) {
          if (it && it.type === 'separator') {
            const div = document.createElement('div');
            div.className = 'co-divider';
            div.setAttribute('role', 'separator');
            panel.appendChild(div);
            return;
          }

          const submenuItems = it && it.submenuKey ? submenus[it.submenuKey] : null;
          const hasSubmenu = Array.isArray(submenuItems);
          const row = makeRow(it || {}, function () {
            if (hasSubmenu) return;
            notifyHost({
              type: 'appMenuCommand',
              commandId: it.commandId || null,
              closedAt: it.closedAt || null,
              profileId: it.profileId || null,
              url: it.url || null,
            });
            hideAll({ hideLens: false });
          }, hasSubmenu);

          if (hasSubmenu) {
            const openSub = function () {
              if (submenuHideTimer) {
                clearTimeout(submenuHideTimer);
                submenuHideTimer = null;
              }
              const br = row.getBoundingClientRect();
              renderSubmenuAt(br, submenuItems, it.submenuWidth || 320);
            };
            row.addEventListener('mouseenter', openSub);
            row.addEventListener('focus', openSub);
          } else {
            row.addEventListener('mouseenter', function () {
              if (submenuHideTimer) {
                clearTimeout(submenuHideTimer);
                submenuHideTimer = null;
              }
              submenu.classList.remove('co-visible');
              submenu.innerHTML = '';
            });
          }

          panel.appendChild(row);
        });

        panel.onmouseleave = function () {
          submenuHideTimer = setTimeout(function () {
            submenu.classList.remove('co-visible');
          }, 120);
        };
        submenu.onmouseenter = function () {
          if (submenuHideTimer) {
            clearTimeout(submenuHideTimer);
            submenuHideTimer = null;
          }
        };
        submenu.onmouseleave = function () {
          submenuHideTimer = setTimeout(function () {
            submenu.classList.remove('co-visible');
          }, 120);
        };

        backdrop.classList.add('co-visible');
        panel.classList.add('co-visible');
      }

      backdrop.addEventListener('mousedown', function () {
        notifyHost({ type: 'dismiss' });
      });

      document.addEventListener('keydown', function (e) {
        if (lensLayer && (e.key === ' ' || e.code === 'Space')) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (e.key === 'Escape') {
          if (panel.classList.contains('co-visible') || submenu.classList.contains('co-visible')) {
            e.preventDefault();
            e.stopPropagation();
            notifyHost({ type: 'dismiss' });
            return;
          }
          if (lensLayer) {
            e.preventDefault();
            e.stopPropagation();
            notifyHost({ type: 'lensSelectionCancel', closeSidebar: true });
            return;
          }
          notifyHost({ type: 'dismiss' });
        }
      });

      if (api && api.onChromeOverlayV1Patch) {
        api.onChromeOverlayV1Patch(function (patch) {
          if (!patch || patch.kind === 'hide') {
            hideAll();
            return;
          }
          if (patch.kind === 'chromeTheme') {
            applyChromeThemeTokens(patch);
            return;
          }
          if (IS_OMNIBOX_OVERLAY) {
            if (patch.kind === 'omniboxSuggestions') {
              renderOmniboxSuggestions(patch);
            }
            return;
          }
          if (IS_LENS_OVERLAY) {
            if (patch.kind === 'lensSelection') {
              renderLensSelection(patch);
            }
            return;
          }
          if (patch.kind === 'lensSelection') {
            return;
          }
          if (patch.kind === 'profileMenu') {
            renderProfileMenu(patch);
            return;
          }
          if (patch.kind === 'siteInfo') {
            renderSiteInfo(patch);
            return;
          }
          if (patch.kind === 'appMenu') {
            renderAppMenu(patch);
            return;
          }
          if (patch.kind === 'bookmarkContextMenu') {
            renderBookmarkContextMenu(patch);
            return;
          }
          if (patch.kind === 'bookmarkFolderMenu') {
            renderBookmarkFolderMenu(patch);
            return;
          }
          if (patch.kind === 'omniboxSuggestions') {
            return;
          }
          if (patch.kind === 'bookmarkEditor') {
            renderBookmarkEditor(patch);
            return;
          }
        });
      }
    })();
  </script>
</body>

</html>
