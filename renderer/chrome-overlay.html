<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --co-ntp-shadow-soft: 0 4px 20px rgba(15, 23, 42, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --co-ntp-shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.35);
      }
    }

    html[data-forced-appearance="light"] {
      --co-ntp-shadow-soft: 0 4px 20px rgba(15, 23, 42, 0.05);
    }

    html[data-forced-appearance="dark"] {
      --co-ntp-shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #backdrop {
      position: fixed;
      inset: 0;
      background: transparent;
      display: none;
    }

    #backdrop.co-visible {
      display: block;
    }

    #backdrop.co-backdrop--omnibox {
      background: transparent;
    }

    #panel {
      position: fixed;
      display: none;
      min-width: 260px;
      max-height: min(360px, 70vh);
      overflow-y: auto;
      padding: 6px 0;
      background: var(--chrome-nav-bg, #394d55);
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      border: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.12));
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    #panel.co-visible {
      display: block;
    }

    .co-row {
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .co-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
    }

    .co-divider {
      height: 1px;
      margin: 6px 12px;
      background: var(--chrome-tab-separator, rgba(0, 0, 0, 0.1));
    }

    .co-row--add {
      font-weight: 500;
    }

    /* ── Bookmark editor (omnibox star) — Chrome-style compact dialog ───────── */
    #panel.co-panel--editor {
      min-width: 280px;
      max-width: min(360px, calc(100vw - 16px));
      max-height: min(480px, 82vh);
      padding: 0;
      overflow: hidden;
      display: none;
      background: var(--chrome-nav-bg, #ffffff);
    }

    #panel.co-panel--editor.co-visible {
      display: flex;
      flex-direction: column;
    }

    .co-bk-editor-scroll {
      padding: 14px 16px 16px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .co-bk-url {
      font-size: 11px;
      color: var(--chrome-url-ghost, #5f6368);
      word-break: break-all;
      line-height: 1.35;
      margin-bottom: 10px;
      max-height: 40px;
      overflow: hidden;
    }

    .co-bk-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .co-bk-field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--chrome-url-ghost, #5f6368);
    }

    .co-bk-input,
    .co-bk-select {
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--chrome-tab-separator, #dadce0);
      border-radius: 6px;
      width: 100%;
      background: var(--chrome-url-well, #ffffff);
      color: var(--chrome-fg, #202124);
      font-family: inherit;
    }

    .co-bk-input:focus,
    .co-bk-select:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }

    .co-bk-link {
      margin-top: 4px;
      padding: 6px 0;
      border: none;
      background: none;
      color: #1a73e8;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .co-bk-link:hover {
      text-decoration: underline;
    }

    .co-bk-new-folder {
      display: none;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--chrome-tab-separator, #e8eaed);
    }

    .co-bk-new-folder.co-bk-visible {
      display: block;
    }

    .co-bk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
      padding-top: 4px;
    }

    .co-bk-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      border: none;
      cursor: pointer;
    }

    .co-bk-btn--primary {
      background: #1a73e8;
      color: #fff;
      font-weight: 500;
    }

    .co-bk-btn--primary:hover {
      background: #1557b0;
    }

    .co-bk-btn--secondary {
      background: var(--chrome-tab-hover-bg, #f1f3f4);
      color: var(--chrome-fg, #202124);
    }

    .co-bk-btn--secondary:hover {
      background: var(--chrome-close-hover, #e8eaed);
    }

    .co-bk-btn--danger {
      background: transparent;
      color: #d93025;
      margin-right: auto;
      padding-left: 0;
    }

    .co-bk-btn--danger:hover {
      text-decoration: underline;
    }

    .co-bk-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ── Omnibox autocomplete (Tier 2, tokens match shell omnibox row) ─ */
    #panel.co-panel--omnibox {
      --co-omnibox-border-shade: color-mix(in srgb, var(--chrome-nav-bg, #394d55) 76%, #000000);
      padding: 0;
      overflow: hidden;
      max-height: min(420px, 72vh);
      background: var(--chrome-nav-bg, #394d55);
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      border: none;
      border-radius: 20px;
      box-shadow: var(--co-ntp-shadow-soft);
      display: flex;
      flex-direction: column;
    }

    #panel.co-panel--omnibox::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 0%, var(--co-omnibox-border-shade) 64%, var(--co-omnibox-border-shade) 100%);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 3;
    }

    .co-ob-input-wrap {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      border-radius: 20px 20px 0 0;
    }

    .co-ob-input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      color: var(--chrome-toolbar-icon, var(--chrome-fg));
      opacity: 0.5;
      z-index: 2;
    }

    .co-ob-input-icon svg {
      width: 14px;
      height: 14px;
    }

    .co-ob-input {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: none;
      outline: none;
      background: transparent;
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      font-family: inherit;
      font-size: 14px;
      padding: 0 15px 0 38px;
      border-radius: 20px 20px 0 0;
    }

    .co-ob-input::selection {
      background: var(--chrome-omnibox-selection-bg, #FFB430);
      color: var(--chrome-omnibox-selection-fg, #ffffff);
    }

    .co-ob-ghost {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 15px 0 38px;
      font-size: 14px;
      font-family: inherit;
      white-space: pre;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      color: transparent;
    }

    .co-ob-ghost__suffix {
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.35));
    }

    #panel.co-panel--omnibox .co-ob-scroll {
      max-height: min(412px, 70vh);
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 6px;
    }

    .co-ob-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 12px;
      font-size: 13px;
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.45));
      text-align: center;
      user-select: none;
      pointer-events: none;
    }

    .co-ob-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 12px;
      min-height: 36px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .co-ob-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
    }

    .co-ob-row--selected {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
      box-shadow: inset 0 0 0 1px var(--chrome-omnibox-focus-border, rgba(255, 180, 48, 0.5));
    }

    .co-ob-row__icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--chrome-toolbar-icon-muted, rgba(255, 255, 255, 0.55));
    }

    .co-ob-row__icon svg {
      width: 14px;
      height: 14px;
      opacity: 1;
    }

    .co-ob-row__favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: contain;
    }

    .co-ob-row__content {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      overflow: hidden;
    }

    .co-ob-row__text {
      flex-shrink: 0;
      max-width: 55%;
      font-size: 13px;
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .co-ob-row__text strong {
      color: var(--chrome-domain, #ffffff);
      font-weight: 600;
    }

    .co-ob-row__description {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.4));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .co-ob-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .co-ob-badge--history {
      background: rgba(255, 255, 255, 0.08);
      color: #aaa;
    }

    .co-ob-badge--search {
      background: rgba(66, 133, 244, 0.18);
      color: #8ab4f8;
    }

    .co-ob-badge--keyword {
      background: rgba(52, 168, 83, 0.18);
      color: #81c995;
    }

    .co-ob-badge--bookmark {
      background: rgba(251, 188, 4, 0.18);
      color: #fdd663;
    }

    .co-ob-badge--url {
      background: rgba(255, 255, 255, 0.08);
      color: #aaa;
    }

    /* ── Bookmark bar folder dropdown (Chrome-style, max 90vh, scroll list) ─── */
    #panel.co-panel--folder-menu {
      display: none;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      max-height: 90vh;
      background: var(--chrome-bookmark-bar, var(--chrome-nav-bg, #2d3e45));
      color: var(--chrome-bkm-text, var(--chrome-fg, rgba(255, 255, 255, 0.88)));
      border: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.12));
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    #panel.co-panel--folder-menu.co-visible {
      display: flex;
    }

    .co-fm-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--chrome-tab-separator, rgba(0, 0, 0, 0.1));
      font-size: 13px;
      font-weight: 600;
      min-height: 40px;
      color: var(--chrome-fg, rgba(255, 255, 255, 0.95));
    }

    .co-fm-header-icon {
      display: flex;
      align-items: center;
      opacity: 0.75;
      color: var(--chrome-toolbar-icon-muted, rgba(255, 255, 255, 0.58));
    }

    .co-fm-header-icon svg {
      width: 14px;
      height: 14px;
    }

    .co-fm-header-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .co-fm-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0;
    }

    .co-fm-empty {
      padding: 16px 12px;
      font-size: 13px;
      color: var(--chrome-url-ghost, rgba(255, 255, 255, 0.4));
      font-style: italic;
    }

    .co-fm-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      min-height: 36px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .co-fm-row:hover {
      background: var(--chrome-tab-hover-bg, rgba(0, 0, 0, 0.06));
    }

    .co-fm-row--folder {
      opacity: 0.68;
      cursor: default;
    }

    .co-fm-row--folder:hover {
      background: var(--chrome-close-hover, rgba(0, 0, 0, 0.04));
    }

    .co-fm-row__icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--chrome-toolbar-icon-muted, rgba(255, 255, 255, 0.58));
    }

    .co-fm-row__icon svg {
      width: 13px;
      height: 13px;
      opacity: 1;
    }

    .co-fm-row__favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      object-fit: contain;
    }

    .co-fm-row__label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="backdrop" aria-hidden="true"></div>
  <div id="panel" role="menu" aria-hidden="true"></div>
  <script>
    (function () {
      const backdrop = document.getElementById('backdrop');
      const panel = document.getElementById('panel');
      const api = window.electronAPI;

      function notifyHost(data) {
        if (api && api.chromeOverlayNotifyHost) api.chromeOverlayNotifyHost(data);
      }

      function applyChromeThemeTokens(patch) {
        const root = document.documentElement;
        const tokens = patch.tokens && typeof patch.tokens === 'object' ? patch.tokens : {};
        Object.keys(tokens).forEach(function (k) {
          const v = tokens[k];
          if (v === undefined || v === null || v === '') return;
          root.style.setProperty(k, String(v));
        });
        root.style.colorScheme = patch.effectiveDark ? 'dark' : 'light';
        const fa = patch.forcedAppearance;
        if (fa === 'light' || fa === 'dark') {
          root.setAttribute('data-forced-appearance', fa);
        } else {
          root.removeAttribute('data-forced-appearance');
        }
      }

      function hideAll() {
        omniboxFocusGen += 1;
        disableOmniboxEscapeDismiss();
        omniboxDismissPending = false;
        omniboxPanelGuardsBound = false;
        omniboxOverlayInput = null;
        omniboxOverlayScroll = null;
        backdrop.classList.remove('co-visible', 'co-backdrop--omnibox');
        panel.classList.remove('co-visible', 'co-panel--editor', 'co-panel--omnibox', 'co-panel--folder-menu');
        panel.style.width = '';
        panel.style.minWidth = '';
        panel.style.maxWidth = '';
        panel.style.maxHeight = '';
        panel.style.padding = '';
        panel.style.overflow = '';
        panel.innerHTML = '';
      }

      const BOOKMARK_MENU_ACTION_IDS = { openBookmark: 1, removeBookmark: 1 };

      var OB_ICON_SVG = {
        history: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.5"/><polyline points="8,4.5 8,8 10.5,10" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        search: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>',
        bookmark: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h10v13l-5-3-5 3V2z"/></svg>',
        keyword: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 8h5M9 8h5M8 2v5M8 9v5"/></svg>',
        url: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5C8 1.5 5.5 4.5 5.5 8s2.5 6.5 2.5 6.5M8 1.5C8 1.5 10.5 4.5 10.5 8S8 14.5 8 14.5M1.5 8h13"/></svg>',
      };

      function appendHighlightedOmnibox(parent, text, query) {
        text = String(text || '');
        query = String(query || '');
        if (!query) {
          parent.appendChild(document.createTextNode(text));
          return;
        }
        var lowerText = text.toLowerCase();
        var lowerQuery = query.toLowerCase();
        var lastIndex = 0;
        var searchFrom = 0;
        while (searchFrom < lowerText.length) {
          var matchIdx = lowerText.indexOf(lowerQuery, searchFrom);
          if (matchIdx === -1) break;
          if (matchIdx > lastIndex) {
            parent.appendChild(document.createTextNode(text.slice(lastIndex, matchIdx)));
          }
          var strong = document.createElement('strong');
          strong.textContent = text.slice(matchIdx, matchIdx + lowerQuery.length);
          parent.appendChild(strong);
          lastIndex = matchIdx + lowerQuery.length;
          searchFrom = lastIndex;
        }
        if (lastIndex < text.length) {
          parent.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
      }

      var omniboxOverlayInput = null;
      var omniboxOverlayScroll = null;
      var omniboxOverlayState = { query: '', selectedIndex: -1, items: [] };
      var omniboxEscapeCapture = null;
      var omniboxDismissPending = false;
      var omniboxPanelGuardsBound = false;
      var omniboxFocusGen = 0;

      function isOmniboxPanelVisible() {
        return panel.classList.contains('co-panel--omnibox')
          && panel.classList.contains('co-visible');
      }

      function dismissOmniboxOnEscape(e) {
        if (e.key !== 'Escape') return;
        if (!isOmniboxPanelVisible()) return;
        e.preventDefault();
        e.stopPropagation();
        if (omniboxDismissPending) return;
        omniboxDismissPending = true;
        notifyHost({ type: 'dismiss', reason: 'escape' });
        setTimeout(function () {
          omniboxDismissPending = false;
        }, 0);
      }

      function enableOmniboxEscapeDismiss() {
        if (!omniboxEscapeCapture) {
          omniboxEscapeCapture = function (e) {
            dismissOmniboxOnEscape(e);
          };
          document.addEventListener('keydown', omniboxEscapeCapture, true);
        }
      }

      function disableOmniboxEscapeDismiss() {
        if (omniboxEscapeCapture) {
          document.removeEventListener('keydown', omniboxEscapeCapture, true);
          omniboxEscapeCapture = null;
        }
      }

      function dismissOmniboxOnBlur() {
        if (!isOmniboxPanelVisible()) return;
        if (omniboxDismissPending) return;
        var active = document.activeElement;
        if (active && panel.contains(active)) return;
        omniboxDismissPending = true;
        notifyHost({ type: 'dismiss', reason: 'blur' });
        setTimeout(function () {
          omniboxDismissPending = false;
        }, 0);
      }

      function bindOmniboxInputBlurDismiss(input) {
        if (!input || input.dataset.coBlurBound === '1') return;
        input.dataset.coBlurBound = '1';
        input.addEventListener('focusout', function () {
          setTimeout(dismissOmniboxOnBlur, 0);
        });
      }

      function bindOmniboxPanelGuards() {
        if (omniboxPanelGuardsBound) return;
        omniboxPanelGuardsBound = true;
        panel.addEventListener('pointerdown', function (e) {
          e.stopPropagation();
        });
        panel.addEventListener('mousedown', function (e) {
          e.stopPropagation();
        });
      }

      function focusOmniboxInput(input, selStart, selEnd, selectAll) {
        if (!input) return;
        var gen = ++omniboxFocusGen;
        var attemptsLeft = 8;

        function applyFocus() {
          try {
            if (typeof window.focus === 'function') window.focus();
            input.focus({ preventScroll: true });
            if (Number.isFinite(selStart) && Number.isFinite(selEnd)) {
              input.setSelectionRange(selStart, selEnd);
            } else if (selectAll) {
              input.select();
            }
          } catch (_) {
            try {
              input.focus({ preventScroll: true });
            } catch (_) { }
          }
        }

        function scheduleFocusAttempt() {
          if (gen !== omniboxFocusGen) return;
          if (!isOmniboxPanelVisible() || !panel.contains(input)) return;
          requestAnimationFrame(function () {
            if (gen !== omniboxFocusGen) return;
            if (!isOmniboxPanelVisible() || !panel.contains(input)) return;
            applyFocus();
            if (document.activeElement === input) return;
            attemptsLeft -= 1;
            if (attemptsLeft > 0) scheduleFocusAttempt();
          });
        }

        scheduleFocusAttempt();
      }

      function renderOmniboxSuggestionRows(scroll, items, query, sel) {
        scroll.innerHTML = '';
        if (!items.length) {
          if (!String(query || '').trim()) return;
          var empty = document.createElement('div');
          empty.className = 'co-ob-empty';

        });
        nfCancel.addEventListener('click', function () {
          nfBlock.classList.remove('co-bk-visible');
          nfInput.value = '';
        });
        nfCreate.addEventListener('click', function () {
          const name = nfInput.value.trim();
          if (!name) return;
          notifyHost({
            type: 'bookmarkEditorCreateFolder',
            name: name.slice(0, 80),
            draftTitle: nameInput.value,
            draftFolderId: sel.value,
          });
        });

        const actions = document.createElement('div');
        actions.className = 'co-bk-actions';
        if (mode === 'edit') {
          const rem = document.createElement('button');
          rem.type = 'button';
          rem.className = 'co-bk-btn co-bk-btn--danger';
          rem.textContent = 'Remove';
          rem.addEventListener('click', function () {
            if (bookmarkId) notifyHost({ type: 'bookmarkEditorRemove', bookmarkId: bookmarkId });
          });
          actions.appendChild(rem);
        }
        const done = document.createElement('button');
        done.type = 'button';
        done.className = 'co-bk-btn co-bk-btn--primary';
        done.textContent = 'Done';
        done.addEventListener('click', function () {
          notifyHost({
            type: 'bookmarkEditorDone',
            title: nameInput.value,
            folderId: sel.value,
            url: pageUrl,
            bookmarkId: bookmarkId,
          });
        });
        actions.appendChild(done);
        scroll.appendChild(actions);

        panel.appendChild(scroll);

        nameInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            done.click();
          }
        });
        nfInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            nfCreate.click();
          }
          if (e.key === 'Escape') {
            e.stopPropagation();
            nfCancel.click();
          }
        });

        setTimeout(function () {
          nameInput.focus();
          nameInput.select();
        }, 0);

        backdrop.classList.add('co-visible');
        panel.classList.add('co-visible');
      }

      function renderProfileMenu(payload) {
        hideAll();
        const r = payload.menuRect || {};
        const left = Math.round(r.left != null ? r.left : 0);
        const top = Math.round(r.top != null ? r.top : 0);
        const width = Math.round(r.width != null ? r.width : 260);
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
        panel.style.width = width + 'px';

        const items = Array.isArray(payload.items) ? payload.items : [];
        items.forEach(function (it) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'co-row';
          btn.setAttribute('role', 'menuitem');
          btn.textContent = it.label || it.profileId || '';
          btn.addEventListener('click', function () {
            notifyHost({ type: 'selectProfile', profileId: it.profileId });
          });
          panel.appendChild(btn);
        });

        if (payload.showEdit) {
          const div = document.createElement('div');
          div.className = 'co-divider';
          div.setAttribute('role', 'separator');
          panel.appendChild(div);
          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'co-row';
          editBtn.setAttribute('role', 'menuitem');
          editBtn.textContent = 'Edit profile…';
          editBtn.addEventListener('click', function () {
            notifyHost({ type: 'editProfile' });
          });
          panel.appendChild(editBtn);
        }

        const div2 = document.createElement('div');
        div2.className = 'co-divider';
        div2.setAttribute('role', 'separator');
        panel.appendChild(div2);

        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'co-row co-row--add';
        addBtn.setAttribute('role', 'menuitem');
        addBtn.textContent = '+  Add new profile';
        addBtn.addEventListener('click', function () {
          notifyHost({ type: 'addProfile' });
        });
        panel.appendChild(addBtn);

        backdrop.classList.add('co-visible');
        panel.classList.add('co-visible');
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') notifyHost({ type: 'dismiss' });
      });

      if (api && api.onChromeOverlayV1Patch) {
        api.onChromeOverlayV1Patch(function (patch) {
          if (!patch || patch.kind === 'hide') {
            hideAll();
            return;
          }
          if (patch.kind === 'chromeTheme') {
            applyChromeThemeTokens(patch);
            return;
          }
          if (patch.kind === 'profileMenu') {
            renderProfileMenu(patch);
            return;
          }
          if (patch.kind === 'bookmarkContextMenu') {
            renderBookmarkContextMenu(patch);
            return;
          }
          if (patch.kind === 'bookmarkFolderMenu') {
            renderBookmarkFolderMenu(patch);
            return;
          }
          if (patch.kind === 'omniboxSuggestions') {
            renderOmniboxSuggestions(patch);
            return;
          }
          if (patch.kind === 'bookmarkEditor') {
            renderBookmarkEditor(patch);
            return;
          }
        });
      }
    })();
  </script>
</body>

</html>
